name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/prepare

      - name: Run tests on iPhone simulator
        run: |
          set -o pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project Efirelle.xcodeproj \
            -scheme Efirelle \
            -destination "id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      # Ошибки сборки и упавшие проверки — в аннотации запуска, чтобы их было видно без чтения журнала.
      - name: Report errors
        if: failure()
        run: |
          grep -E "error: |recorded an issue|Expectation failed|failed with" "$RUNNER_TEMP/xcodebuild.log" \
            | sed "s#$GITHUB_WORKSPACE/##" | awk '!seen[$0]++' | head -10 \
            | while IFS= read -r line; do echo "::error::$line"; done
