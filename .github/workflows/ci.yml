name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare

      - name: Run tests on iPhone simulator
        run: |
          set -o pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild test \
            -project Efirelle.xcodeproj \
            -scheme Efirelle \
            -destination "id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=NO
