name: TestFlight

# Запуск вручную: Actions → TestFlight → Run workflow.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_KEY_ID       — Key ID ключа App Store Connect API
#   APP_STORE_CONNECT_ISSUER_ID    — Issuer ID
#   APP_STORE_CONNECT_PRIVATE_KEY  — содержимое файла AuthKey_XXXX.p8 целиком
# и переменная APPLE_TEAM_ID (Settings → Secrets and variables → Actions → Variables).
on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & upload
    runs-on: macos-15
    timeout-minutes: 45
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ARCHIVE_PATH: ${{ runner.temp }}/Efirelle.xcarchive
      EXPORT_PATH: ${{ runner.temp }}/export
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare

      - name: Install App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$PRIVATE_KEY" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::Не заданы секреты App Store Connect или переменная APPLE_TEAM_ID — см. комментарий в начале файла."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Efirelle.xcodeproj \
            -scheme Efirelle \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"
