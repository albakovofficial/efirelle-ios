name: TestFlight

# Запускается сам после каждого успешного CI на main (новые версии сразу уходят в TestFlight)
# и вручную: Actions → TestFlight → Run workflow. Пока секретов нет — сборка пропускается без ошибки.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_KEY_ID       — Key ID ключа App Store Connect API
#   APP_STORE_CONNECT_ISSUER_ID    — Issuer ID
#   APP_STORE_CONNECT_PRIVATE_KEY  — содержимое файла AuthKey_XXXX.p8 целиком
# и APPLE_TEAM_ID — переменной или секретом.
#
# Версия — MARKETING_VERSION из project.yml (1.0). Номер сборки идёт по порядку: 1, 2, 3, 4…
# Он берётся из App Store Connect (последняя загруженная сборка + 1), поэтому неудачные запуски номер не тратят.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & upload
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      # Team ID не секрет, но можно задать и переменной, и секретом.
      TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check App Store Connect secrets
        id: secrets
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$TEAM_ID" ]; then
            echo "::notice::Секреты App Store Connect ещё не заданы — сборка для TestFlight пропущена. См. комментарий в начале файла."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          # После CI собираем ровно тот коммит, который прошёл проверки.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/prepare
        if: steps.secrets.outputs.ready == 'true'

      - name: Install App Store Connect API key
        if: steps.secrets.outputs.ready == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$PRIVATE_KEY" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::Не заданы секреты App Store Connect или переменная APPLE_TEAM_ID — см. комментарий в начале файла."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$PRIVATE_KEY" > "$KEY_PATH"
          {
            echo "KEY_PATH=$KEY_PATH"
            echo "ARCHIVE_PATH=$RUNNER_TEMP/Efirelle.xcarchive"
            echo "EXPORT_PATH=$RUNNER_TEMP/export"
          } >> "$GITHUB_ENV"

      - name: Next build number
        if: steps.secrets.outputs.ready == 'true'
        env:
          BUNDLE_ID: com.efirelle.app
        run: |
          BUILD_NUMBER=$(ruby scripts/next-build-number.rb)
          echo "Сборка $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      # Архив без подписи: автоматическая подпись при архивации — «для разработки» и требует
      # зарегистрированный iPhone. Подписывает для App Store шаг выгрузки (облачная подпись Apple).
      - name: Archive
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Efirelle.xcodeproj \
            -scheme Efirelle \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      # Без подписи в приложении нет разрешений (push). Временная подпись «-» вшивает их,
      # а выгрузка переподписывает приложение, сохраняя разрешения.
      - name: Embed entitlements
        if: steps.secrets.outputs.ready == 'true'
        run: |
          sed 's/$(APS_ENVIRONMENT)/production/' Efirelle/Efirelle.entitlements > "$RUNNER_TEMP/Release.entitlements"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/Release.entitlements" \
            "$ARCHIVE_PATH/Products/Applications/Efirelle.app"
          codesign -d --entitlements - "$ARCHIVE_PATH/Products/Applications/Efirelle.app"

      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tee -a "$RUNNER_TEMP/xcodebuild.log"

      # Ошибки подписи и выгрузки — в аннотации запуска.
      - name: Report errors
        if: failure() && steps.secrets.outputs.ready == 'true'
        run: |
          touch "$RUNNER_TEMP/xcodebuild.log"
          grep -E "error: |error:|Error Domain|FAILED" "$RUNNER_TEMP/xcodebuild.log" \
            | sed "s#$GITHUB_WORKSPACE/##" | awk '!seen[$0]++' | head -10 \
            | while IFS= read -r line; do echo "::error::$line"; done

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"
