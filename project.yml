# Проект Xcode генерируется из этого файла: `xcodegen generate`.
# Сам .xcodeproj в репозиторий не коммитим — так не бывает конфликтов слияния.
name: Efirelle

options:
  bundleIdPrefix: com.efirelle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # укажите Team ID из Apple Developer
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Efirelle:
    type: application
    platform: iOS
    sources:
      - path: Efirelle
    info:
      path: Efirelle/Info.plist
      properties:
        CFBundleDisplayName: Efirelle
        CFBundleDevelopmentRegion: ru
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.efirelle.app
        CODE_SIGN_ENTITLEMENTS: Efirelle/Efirelle.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

  EfirelleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EfirelleTests
    dependencies:
      - target: Efirelle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Efirelle:
    build:
      targets:
        Efirelle: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EfirelleTests
