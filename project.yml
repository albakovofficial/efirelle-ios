# Проект Xcode генерируется из этого файла: `xcodegen generate`.
# Сам .xcodeproj в репозиторий не коммитим — так не бывает конфликтов слияния.
name: Efirelle

options:
  bundleIdPrefix: com.efirelle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # укажите Team ID из Apple Developer
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  # Эфир с камеры iPhone: захват, кодирование и отправка по RTMP.
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.2.5

targets:
  Efirelle:
    type: application
    platform: iOS
    sources:
      - path: Efirelle
      - path: Shared
    dependencies:
      - target: EfirelleLiveActivity
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
    info:
      path: Efirelle/Info.plist
      properties:
        # Версия и номер сборки — из настроек (MARKETING_VERSION, CURRENT_PROJECT_VERSION);
        # TestFlight подставляет номер сборки при архивации.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Efirelle
        CFBundleDevelopmentRegion: ru
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Лёжа — только полноэкранный эфир; остальное приложение вертикальное (OrientationLock).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Звук эфира и картинка в картинке продолжаются, когда приложение свёрнуто.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        # Ссылки efirelle://channel/<адрес> — по нажатию на Live Activity.
        CFBundleURLTypes:
          - CFBundleURLName: com.efirelle.app
            CFBundleURLSchemes: [efirelle]
        NSCameraUsageDescription: Камера нужна, чтобы вести эфир с iPhone — зрители увидят то, что снимаете.
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы зрители слышали вас в эфире с iPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.efirelle.app
        CODE_SIGN_ENTITLEMENTS: Efirelle/Efirelle.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

  # Live Activity «канал в эфире»: экран блокировки и Dynamic Island.
  # Цвета, шрифты и отступы — общие с приложением, чтобы не дублировать.
  EfirelleLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: EfirelleLiveActivity
      - path: Shared
      - path: Efirelle/DesignSystem/Theme/Palette.swift
      - path: Efirelle/DesignSystem/Theme/Metrics.swift
      - path: Efirelle/DesignSystem/Theme/Typography.swift
      - path: Efirelle/Core/Models/Tone.swift
    info:
      path: EfirelleLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Efirelle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.efirelle.app.LiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"

  EfirelleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EfirelleTests
    dependencies:
      - target: Efirelle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Efirelle:
    build:
      targets:
        Efirelle: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EfirelleTests
